<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 - IC 燒錄 MES 系統</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="login-container">
    <!-- 背景裝飾 -->
    <div class="background-decoration">
      <div class="decoration-circle circle-1"></div>
      <div class="decoration-circle circle-2"></div>
      <div class="decoration-circle circle-3"></div>
    </div>

    <!-- 登入表單容器 -->
    <div class="login-form-container">
      <!-- 公司Logo和標題 -->
      <div class="login-header">
        <div class="logo-container">
          <img src="/assets/images/logo/suiyao-logo.png" alt="SUIYAO Logo" class="logo">
        </div>
        <h1 class="login-title">IC 燒錄 MES 系統</h1>
        <p class="login-subtitle">請輸入您的登入資訊</p>
      </div>

      <!-- 登入表單 -->
      <form class="login-form">
        <!-- 信箱輸入框 -->
        <div class="form-group">
          <label for="email" class="form-label">
            <i class="fas fa-envelope"></i>
            電子信箱
          </label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="請輸入電子信箱"
          >
        </div>

        <!-- 密碼輸入框 -->
        <div class="form-group">
          <label for="password" class="form-label">
            <i class="fas fa-lock"></i>
            密碼
          </label>
          <div class="password-input-container">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="請輸入密碼"
            >
            <button type="button" class="password-toggle">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- 登入按鈕 -->
        <button type="button" class="login-button">
          <span class="button-text">登入</span>
        </button>
      </form>

      <!-- 頁腳資訊 -->
      <div class="login-footer">
        <p class="footer-text">
          © 2025 SUIYAO IC 燒錄 MES 系統
        </p>
        <p class="footer-version">
          版本 8.0.0
        </p>
      </div>
    </div>
  </div>
</body>
</html>
